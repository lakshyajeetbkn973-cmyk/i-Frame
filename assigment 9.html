<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 500px;
            width: 800px;
            background-color: teal;
            display: flex;
            justify-content: center;
            margin: auto;
        }

        .box{
            height: 80%;
            width: 80%;
             justify-content: center;
            margin: auto;
            
            background-color: skyblue;
            
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .box1{
            height: 80%;
            width: 80%;
            background-color: blue;
            border: 20px solid navy;
             justify-content: center;
            margin: 40px 20px 20px 55px;
            padding: 60PX 20PX 20PX 75PX;
        }
        .box2{
            height: 80%;
            width: 80%;
            background-color: orange;
            
        }
        .margin{
            position: absolute;
            top: 100px;
            left: 460px;
            text-align: center;
            color: white;
            right: 500px;
            
        }                                            
        .border{
            position: absolute;
            top: 135px;
            left: 235px;
            color: white;
            line-height: 10PX;
            text-align: center;
            bottom: 300px;
            right: 270px;

        }
        .padding{
            position: absolute;
            top: 180px;
            left: 235px;
            color: white;
            line-height: 10PX;
            text-align: center;
            bottom: 300px;
            right: 270px;
        }
        .content{
            position: absolute;
            top: auto;
            left: 240px;
            color: white;
            text-align: center;
            line-height: 148px;
            right: 270px;

        }

       
       
    </style>
</head>
<body>
    <h1 align="center">Box Ploatting </h1>
    <div class="con">
        <div class="box">
             <div class="margin">Margin</div>
            <div class="box1">
                <div class="border">Border</div>
                <div class="padding">Padding</div>
               
               
                <div class="box2">
                    <div class="content">Content</div>
                </div>
            </div>
        </div>
        
    </div>
   
</body>
</html>
