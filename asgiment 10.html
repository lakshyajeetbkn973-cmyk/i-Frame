<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            height: 600px;
            background: linear-gradient(90deg,skyblue,violet);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        form{
            height: 80%;
            width: 30%;
            background-color: white;
            border-radius: 10px;
            

        }
        .email,.password,.login{
            /*border: 1px solid black;*/
            width: 90%;
            margin: auto;
            margin:3% ;
        }
        input{
            width: 100%;
            height: 50%;
            margin-top: 5%;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        h1{
            height: 10%;
            margin-top: 5%;
            /*line-height: 150%;*/
        }
        p{
            margin-top: 3%;
        }
        button{
            background: linear-gradient(90deg,blue,purple);
            border: none;
            border-radius: 10px;
            color: white;
        }
        .password>p{
            color: gray;
            font-style: italic;
        }
        .login{
            text-align: center;
        }
        a{
            text-decoration: none;
            font-style: italic;
        }
    </style>
</head>
<body>
    <form action="">
        <h1 align="center">Login Form</h1>
        <div class="email">
            <label for="">Email</label>
            <input type="email">
        </div>
         <div class="password">
            <label for="">Password</label>
            <input type="password">
            <p>Forget Password ?</p>
        </div>
        <div class="login">
            <input type="button" value="Login">
            <p>Not a Member ?<a href="singnup.html">Sign Up</a></p>
        </div>
    </form>
    
</body>
</html>
