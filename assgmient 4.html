<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 600px;
            border: 1px solid black;
            display: flex;
        }
        .box{
            height: 100px;
            width: 25%;
            border: 1px solid black;
        }
        img{
            width: 100%;
        }
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <H1 align="center">Dynamic Gallery</H1>
    <div class="container">
        <div class="box">
             <img src="1.png.png" alt="">
            <img src="2.png.png" alt="">
            <img src="3.png.png" alt="">
            <img src="4.png" alt="">
        </div>
        <div class="box">
             <img src="4.png" alt="">
            <img src="3.png.png" alt="">
            <img src="2.png.png" alt="">
            <img src="1.png.png" alt="">
            

        </div>
        <div class="box">
             <img src="1.png.png" alt="">
            <img src="3.png.png" alt="">
            <img src="2.png.png" alt="">
            <img src="4.png" alt="">
        </div>
        <div class="box">
             <img src="2.png.png" alt="">
            <img src="4.png" alt="">
            <img src="1.png.png" alt="">
            <img src="3.png.png" alt="">
        </div>
    </div>
    
</body>
</html>
