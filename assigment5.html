<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
    <style>
        *{
            margin: 0;
        padding:0;
    }
        .con{
            height: 600px;
            display: flex;
             align-items: center;
            justify-content: center;
        }
        .box{
            height: 80%;
            width: 80%;
            display: flex;
            /* box-shadow: 10px 10px 10px 10px; */
            border-radius: 20px;
            
        }
        .left,.right,.center{
            height: 100%;
           /* border: 1px;*/
        }
        .left{
            width: 3%;
            background-color: navy;
            border-radius: 20px;
        }
        .center{
            width: 63%;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: white;
            color: navy;
        }
        .center>h1{
            /* margin-left: 20px; */
        }
        .right{
            width: 35%;
            border-radius: 20px;
            box-shadow: 10px 10px 10px;
            border-left: 1px solid gray
            
            
        }
        .top{
            height: 30%;
           /* border: 1px solid black;*/


        }
        .bottom{
            height: 70%;
           /* border: 1px solid black;*/
            
            


        }
        .top-in{
            height: 90%;
           /* border: 1px solid black;*/
            background-color: navy;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            


        }
        .circle{
            height: 120px;
            width: 120px;
            border: 3px solid navy;
            border-radius:50% ;
            position: absolute;
            top: 13%;
            right: 19%;
        }
        img{
            height: 100%;
            width: 100%;
            border-radius: 50%;
            border: 2px solid white;
        }
        .Button{
            height: 20%;
            /*border: 1px solid black;*/
            justify-content: space-evenly;
            align-items: center;
            display: flex;
        }
        .bottom>h1{
            text-align: center;
        }
        .icon{
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            
        }
        .button1{
            height: 50%;
            width: 40%;
            background-color: navy;
            color: white;
            border-radius: 20PX;
            text-align: center;
            line-height: 30px;
        }
         .button2{
            height: 50%;
            width: 40%;
            background-color: navy;
            color: white;
            border-radius: 20PX;
            text-align: center;
            line-height: 30px;
        }
        .fa-facebook{
        color: blue;
        }
        .fa-linkedin{
            color:blue;
        }
        .fa-github{
            color: purple;
        }
        .fa-behance{
            color: green;
        }
        .fa-instagram{
            color: pink;
        }
        .fa-heart{
            color: red;
             line-height: 20px;
            
            
        }
        .fa-share{
            color: blue;
            line-height: 20px;
        }
        .fa-comment{
             line-height: 20px;
        }

</head>

<div class="con">

        </div>
        <div class="right">

                <div class="top-in">

                </div>

                     <i class="fa fa-solid fa-heart fa-500">

                     </i>

                    </i>

                    </i>
                    
                </div>
                </div>
            </div>
        </div>
    </div>

</div>
